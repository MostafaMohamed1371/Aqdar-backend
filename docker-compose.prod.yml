# Production Docker Compose — nginx LB, Redis, Horizon, horizontal app scale
#
# Usage:
#   export DOCKER_IMAGE=ghcr.io/your-org/aqdar-backend:latest
#   docker compose -f docker-compose.prod.yml up -d --scale app=3

name: aqdar-backend-prod

services:
  app:
    image: ${DOCKER_IMAGE:-ghcr.io/your-org/aqdar-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: always
    env_file:
      - .env.production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqdar

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
      args:
        APP_IMAGE: ${DOCKER_IMAGE:-ghcr.io/your-org/aqdar-backend:latest}
    restart: always
    ports:
      - "${DOCKER_HTTP_PORT:-8080}:80"
    depends_on:
      - app
    networks:
      - aqdar

  horizon:
    image: ${DOCKER_IMAGE:-ghcr.io/your-org/aqdar-backend:latest}
    restart: always
    env_file:
      - .env.production
    command: php artisan horizon
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - aqdar

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - aqdar

  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aqdar}
      MYSQL_USER: ${DB_USERNAME:-aqdar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${DB_ROOT_PASSWORD:-secret}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - aqdar

volumes:
  mysql_data:
  redis_data:

networks:
  aqdar:
    driver: bridge
