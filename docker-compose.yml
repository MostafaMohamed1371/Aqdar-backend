# AQDAR Laravel — local Docker stack
# Usage: docker compose up -d --build
# App:      http://localhost:8080
# Postgres: localhost:5433 (user: aqdar, database: aqdar)

name: aqdar-backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqdar

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aqdar

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${DOCKER_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - aqdar

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DOCKER_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DOCKER_POSTGRES_DATABASE:-aqdar}
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-aqdar}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_POSTGRES_USER:-aqdar} -d ${DOCKER_POSTGRES_DATABASE:-aqdar}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - aqdar

volumes:
  postgres_data:
  redis_data:

networks:
  aqdar:
    driver: bridge
