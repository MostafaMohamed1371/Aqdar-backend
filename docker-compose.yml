# AQDAR Laravel — local Docker stack
# Usage: docker compose up -d --build
# App:   http://localhost:8080
# MySQL: localhost:3307 (user: aqdar, database: aqdar)

name: aqdar-backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqdar

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aqdar

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${DOCKER_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - aqdar

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DOCKER_MYSQL_DATABASE:-aqdar}
      MYSQL_USER: ${DOCKER_MYSQL_USER:-aqdar}
      MYSQL_PASSWORD: ${DOCKER_MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:-secret}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${DOCKER_MYSQL_ROOT_PASSWORD:-secret}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - aqdar

volumes:
  mysql_data:
  redis_data:

networks:
  aqdar:
    driver: bridge
