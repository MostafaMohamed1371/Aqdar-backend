[pytest]
testpaths = integration e2e bdd/step_defs performance
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    e2e: End-to-end browser tests (requires running app + Chrome)
    performance: Load and resource usage tests
    bdd: Behavior-driven Gherkin scenarios
addopts = -v --tb=short

[bdd]
features_base_dir = bdd/features
