# Horizontal scaling overlay — shared Redis + load-balanced app replicas + Horizon workers
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build --scale app=3
#
# App:     http://localhost:8080  (nginx round-robins across app containers)
# Horizon: http://localhost:8080/horizon

name: aqdar-backend

services:
  nginx:
    volumes:
      - ./docker/nginx/load-balancer.conf:/etc/nginx/conf.d/default.conf:ro

  app:
    depends_on:
      redis:
        condition: service_healthy

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env.docker
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - aqdar
